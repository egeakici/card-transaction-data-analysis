  WALMART: ['^WAL[ -]?MART(?: |$)', '^WM SUPERCENTER(?: |$)']
  STAPLES: ['^STAPLS(?: |$)', '^STAPLES(?: |$)']
  GRAINGER: ['^(?:W ?W ?)?GRAINGER(?: |$)']
