# Source licensing evidence; review date is not a permission letter.
schema_version: 1
reviewed_at: '2026-11-04'
scope: Eleven study sources only; current published evidence, not a legal opinion or clearance of every supplied
  historical file.
software_license:
  identifier: MIT
  file: LICENSE
  scope: Original software only; excludes datasets, source-derived content and third-party references.
release_policy:
  raw_data_release: false
  annotated_dataset_release: false
  zenodo_doi: null
  ethics_committee_decision: null
  written_permissions_received: false
  public_derived_content_clearance: not_certified; source text and reference extracts require separate review
field_semantics:
  verified_at: Date the cited published declaration, restriction or conflict was checked; not written permission
    or complete historical-snapshot clearance. Null means no licence could be verified.
  checked_at: Date of review attempt, including unsuccessful portal access.
  license: SPDX identifier where established; LicenseRef values are local assessment labels, not new licences or
    grants.
  evidence_url: Primary publisher/catalogue URL; for not_verified entries it identifies the attempted source, not
    proof of permission.
  attribution_text: Credit text; for held sources this does not establish permission. OGL attribution is incorporated
    from ATTRIBUTION.md.
  license_url: Published terms/declaration URL, or null where not established.
redistribution_tiers:
  hold: Do not redistribute source records or copied source content through this project until scope/version/conflict/permission
    is resolved. Metadata, links and independently authored analysis remain subject to separate review.
  conditional_source_terms: A published grant/declaration was found. Any future redistribution still requires snapshot
    matching, applicable notices, excluded-rights and privacy checks. No records are released by this repository.
